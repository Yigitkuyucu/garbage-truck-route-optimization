[project]
name = "rota-optimizasyon"
version = "0.1.0"
description = "Dinamik Atik Toplama ve Rota Optimizasyonu - Faz 1"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "osmnx>=2.0",
    "networkx>=3.3",
    "scipy>=1.13",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "ortools>=9.10",
    "streamlit>=1.36",
    "folium>=0.17",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "pypandoc-binary>=1.17",
    "httpx2>=2.9.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# Proje metinleri Turkcedir; 'ı/ş/ğ' harfleri "belirsiz karakter" degildir.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# FastAPI'nin bagimlilik enjeksiyonu varsayilan argumanda cagri gerektirir
# (File/Depends/Query); B008 bu cerceve icin gecerli degildir.
"api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["domain", "solvers"]

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
